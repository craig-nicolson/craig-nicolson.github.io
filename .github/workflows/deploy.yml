# Builds the waveform page and publishes it to GitHub Pages on every push to main:
# the plain index.html at the root, and the page at /waveforms/.
# One-off setup: Settings → Pages → Build and deployment → Source: GitHub Actions.
# Based on Vite's GitHub Pages guide; actions are pinned to exact commits.
name: Deploy to GitHub Pages

on:
  push:
    branches: ['main', 'master']
  # Lets you run it by hand from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: lts/*
          cache: 'npm'
          cache-dependency-path: waveforms/package-lock.json
      - name: Install dependencies
        working-directory: waveforms
        run: npm ci
      # Stops the deploy if waveforms/src/flow.json has a problem
      - name: Check the data
        working-directory: waveforms
        run: npm run check:flow
      - name: Build
        working-directory: waveforms
        run: npm run build
      # The site: the root link page, with the built page under /waveforms/
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r waveforms/dist _site/waveforms
          touch _site/.nojekyll
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: './_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
